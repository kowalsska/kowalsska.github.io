    <g fill="#12354F"><circle cx="-7" cy="-7" r="3.1"/><circle cx="7" cy="7" r="3.1"/><circle cx="0" cy="0" r="3.1"/></g>
  </g>
  <text x="706" y="150" font-size="15" font-weight="bold" fill="#12354F" opacity="0.8">&#215; 10,000 sims</text>

  <!-- ===== surfer: laptop in one hand, shaka in the other ===== -->
  <g transform="translate(800,296) rotate(-34) scale(1.05)">
    <path d="M -70,18 C -92,42 -70,60 -48,52" fill="none" stroke="#12354F" stroke-width="2.5" opacity="0.8"/>
    <path d="M -60,24 L -52,42 L -40,24 Z" fill="#12354F"/>
    <rect x="-78" y="6" width="156" height="18" rx="9" fill="#FFF4E2" stroke="#12354F" stroke-width="3"/>
    <path d="M -58,15 L 58,15" stroke="#FF6B6B" stroke-width="3"/>
    <path d="M -14,6 L -6,-18" stroke="#0F3B5C" stroke-width="12" stroke-linecap="round"/>
    <path d="M 22,6 L 8,-16" stroke="#0F3B5C" stroke-width="12" stroke-linecap="round"/>
    <path d="M -6,-18 L 4,-46" stroke="#0F3B5C" stroke-width="18" stroke-linecap="round"/>
    <path d="M -2,-40 L -40,-52" stroke="#F2C49B" stroke-width="9" stroke-linecap="round"/>
    <circle cx="-44" cy="-54" r="7" fill="#F2C49B"/>
    <path d="M -49,-58 L -58,-64" stroke="#F2C49B" stroke-width="5" stroke-linecap="round"/>
    <path d="M -41,-49 L -34,-43" stroke="#F2C49B" stroke-width="5" stroke-linecap="round"/>
    <path d="M 2,-38 L 40,-48" stroke="#F2C49B" stroke-width="9" stroke-linecap="round"/>
    <circle cx="8" cy="-60" r="14" fill="#F2C49B"/>
    <path d="M -5,-64 C -2,-82 20,-84 22,-64 C 15,-72 2,-72 -5,-64 Z" fill="#3A2A1F"/>
    <g transform="translate(54,-56) rotate(-14)">
      <rect x="-20" y="-14" width="40" height="27" rx="3" fill="#DCE9F2" stroke="#12354F" stroke-width="3"/>
      <rect x="-15" y="-10" width="30" height="18" fill="#12354F"/>
      <g fill="#4FC3F7"><rect x="-11" y="0" width="5" height="6"/><rect x="-3" y="-4" width="5" height="10"/><rect x="5" y="-7" width="5" height="13"/></g>
    </g>
  </g>

  <!-- shark fin flying a significance pennant -->
  <ellipse cx="1060" cy="502" rx="70" ry="10" fill="#0E4166" opacity="0.6"/>
  <path d="M 1022,502 C 1042,440 1068,420 1092,502 Z" fill="#0E3B5B"/>
  <path d="M 1058,502 C 1064,452 1074,436 1086,496 Z" fill="#1A5F8C"/>
  <path d="M 1072,436 L 1072,388" stroke="#12354F" stroke-width="4" stroke-linecap="round"/>
  <path d="M 1072,388 L 1176,404 L 1072,420 Z" fill="#FF6B6B"/>
  <text x="1082" y="410" font-size="14" font-weight="bold" fill="#FFFFFF">p &#60; 0.05</text>

  <!-- seagull holding a judge's scorecard -->
  <g>
    <ellipse cx="500" cy="190" rx="24" ry="13" fill="#FFFFFF" stroke="#12354F" stroke-width="2.5"/>
    <circle cx="518" cy="176" r="10" fill="#FFFFFF" stroke="#12354F" stroke-width="2.5"/>
    <path d="M 527,176 L 540,180 L 527,184 Z" fill="#F5A623"/>
    <circle cx="520" cy="173" r="1.8" fill="#12354F"/>
    <path d="M 494,182 C 484,164 462,160 452,172" fill="none" stroke="#12354F" stroke-width="3" stroke-linecap="round"/>
    <path d="M 478,192 L 462,200" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
    <path d="M 500,203 L 500,220" stroke="#12354F" stroke-width="2.5"/>
    <rect x="472" y="220" width="56" height="40" rx="5" fill="#FFFFFF" stroke="#12354F" stroke-width="3"/>
    <text x="500" y="249" font-size="21" font-weight="bold" fill="#12354F" text-anchor="middle">9.5</text>
  </g>

  <!-- sand -->
  <path d="M 0,436 C 160,406 330,418 520,494 L 520,560 L 0,560 Z" fill="#F0D9A8"/>
  <path d="M 0,458 C 150,430 320,442 470,506 L 470,522 C 320,458 150,446 0,476 Z" fill="#E3C48E" opacity="0.55"/>

  <!-- palm tree -->
  <path d="M 78,452 C 70,380 62,320 58,258" fill="none" stroke="#8A5A3B" stroke-width="15" stroke-linecap="round"/>
  <g fill="none" stroke="#2FA36B" stroke-width="13" stroke-linecap="round">
    <path d="M 58,252 C 20,230 -4,244 -14,268"/>
    <path d="M 58,252 C 26,206 -2,196 -22,208"/>
    <path d="M 58,252 C 70,198 110,180 140,190"/>
    <path d="M 58,252 C 92,222 128,224 146,244"/>
    <path d="M 58,252 C 50,212 54,196 62,180"/>
  </g>
  <circle cx="64" cy="264" r="7" fill="#7A4A2B"/>
  <circle cx="76" cy="259" r="6" fill="#7A4A2B"/>

  <!-- the van -->
  <g transform="translate(0,-16)">
  <ellipse cx="216" cy="444" rx="104" ry="11" fill="#D9B87E" opacity="0.7"/>
  <rect x="130" y="322" width="176" height="13" rx="6.5" fill="#FFF4E2" stroke="#12354F" stroke-width="2.5"/>
  <rect x="118" y="340" width="196" height="46" rx="14" fill="#4FBFA8"/>
  <rect x="118" y="380" width="196" height="36" rx="10" fill="#FFF4E2"/>
  <rect x="118" y="340" width="196" height="76" rx="14" fill="none" stroke="#12354F" stroke-width="3"/>
  <rect x="134" y="352" width="58" height="30" rx="5" fill="#BFE7F5" stroke="#12354F" stroke-width="2.5"/>
  <rect x="202" y="352" width="48" height="30" rx="5" fill="#BFE7F5" stroke="#12354F" stroke-width="2.5"/>
  <circle cx="264" cy="368" r="13" fill="none" stroke="#12354F" stroke-width="2.5"/>
  <path d="M 264,355 L 264,381 M 253,362 L 275,375 M 275,362 L 253,375" stroke="#12354F" stroke-width="2.5"/>
  <circle cx="156" cy="420" r="17" fill="#12354F"/><circle cx="156" cy="420" r="7" fill="#E3C48E"/>
  <circle cx="280" cy="420" r="17" fill="#12354F"/><circle cx="280" cy="420" r="7" fill="#E3C48E"/>
  </g>

  <!-- beach sign -->
  <path d="M 452,500 L 452,430" stroke="#8A5A3B" stroke-width="9" stroke-linecap="round"/>
  <rect x="378" y="392" width="152" height="42" rx="6" fill="#FFF4E2" stroke="#12354F" stroke-width="3"/>
  <text x="454" y="419" font-size="15" font-weight="bold" fill="#12354F" text-anchor="middle">LOCALS ONLY (n=1)</text>

  <!-- trophy + plaque -->
  <g transform="translate(330,498)">
    <path d="M -26,-30 L 26,-30 L 20,6 L -20,6 Z" fill="#F5C542" stroke="#B8860B" stroke-width="2.5"/>
    <path d="M -26,-24 C -44,-24 -46,0 -26,2" fill="none" stroke="#F5C542" stroke-width="6"/>
    <path d="M 26,-24 C 44,-24 46,0 26,2" fill="none" stroke="#F5C542" stroke-width="6"/>
    <rect x="-7" y="6" width="14" height="14" fill="#E0A800"/>
    <rect x="-22" y="20" width="44" height="12" rx="3" fill="#8A5A3B"/>
  </g>
  <text x="372" y="522" font-size="15" font-weight="bold" fill="#12354F">P(1st) = 0.34</text>

  <!-- flip-flops -->
  <g stroke="#12354F" stroke-width="2.5">
    <g transform="translate(138,502) rotate(-16)">
      <ellipse cx="0" cy="0" rx="16" ry="30" fill="#FF6B6B"/>
      <path d="M 0,-20 L -8,4 M 0,-20 L 8,4" fill="none"/>
    </g>
    <g transform="translate(184,514) rotate(12)">
      <ellipse cx="0" cy="0" rx="16" ry="30" fill="#4FBFA8"/>
      <path d="M 0,-20 L -8,4 M 0,-20 L 8,4" fill="none"/>
    </g>
  </g>

  <!-- title -->
  <text x="298" y="88" font-size="44" font-weight="bold" fill="#12354F" font-family="'Raleway', 'Helvetica Neue', Arial, sans-serif">SurfStatsIO</text>
  <text x="300" y="116" font-size="17" fill="#2A5B79">peer-reviewed stoke &#183; backtested since 2008</text>
</svg>
