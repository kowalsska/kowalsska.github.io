<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="'Open Sans', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8A5B"/>
      <stop offset="55%" stop-color="#FFB77A"/>
      <stop offset="100%" stop-color="#FFE2B6"/>
    </linearGradient>
    <linearGradient id="waveg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E90C4"/>
      <stop offset="100%" stop-color="#17547E"/>
    </linearGradient>
    <clipPath id="waveclip">
      <path d="M 520,560 C 600,470 690,400 790,320 C 870,256 928,198 962,140 C 1000,196 1058,236 1120,252 C 1150,259 1176,262 1200,262 L 1200,560 Z"/>
    </clipPath>
  </defs>

  <!-- sky -->
  <rect width="1200" height="560" fill="url(#sky)"/>

  <!-- sun with confidence rings -->
  <circle cx="1090" cy="105" r="62" fill="#FFE9A0"/>
  <circle cx="1090" cy="105" r="84" fill="none" stroke="#FFF3C4" stroke-width="3" stroke-dasharray="7 9" opacity="0.9"/>
  <circle cx="1090" cy="105" r="104" fill="none" stroke="#FFF3C4" stroke-width="2" stroke-dasharray="4 10" opacity="0.7"/>
  <text x="1112" y="214" font-size="13" font-weight="bold" fill="#12354F" opacity="0.75">95% CI</text>

  <!-- ocean -->
  <rect x="0" y="330" width="1200" height="230" fill="#17547E"/>
  <rect x="0" y="330" width="1200" height="24" fill="#2E90C4"/>

  <!-- ===== the wave (its face is a histogram) ===== -->
  <path d="M 520,560 C 600,470 690,400 790,320 C 870,256 928,198 962,140 C 1000,196 1058,236 1120,252 C 1150,259 1176,262 1200,262 L 1200,560 Z" fill="url(#waveg)"/>

  <g clip-path="url(#waveclip)">
    <g fill="#57B0DC" opacity="0.55">
      <rect x="545" y="550" width="22" height="30" rx="3"/>
      <rect x="575" y="502" width="22" height="78" rx="3"/>
      <rect x="605" y="508" width="22" height="72" rx="3"/>
      <rect x="635" y="456" width="22" height="124" rx="3"/>
      <rect x="665" y="420" width="22" height="160" rx="3"/>
      <rect x="695" y="426" width="22" height="154" rx="3"/>
      <rect x="725" y="382" width="22" height="198" rx="3"/>
      <rect x="755" y="348" width="22" height="232" rx="3"/>
      <rect x="785" y="346" width="22" height="234" rx="3"/>
      <rect x="815" y="306" width="22" height="274" rx="3"/>
      <rect x="845" y="310" width="22" height="270" rx="3"/>
      <rect x="875" y="256" width="22" height="324" rx="3"/>
      <rect x="905" y="208" width="22" height="372" rx="3"/>
      <rect x="935" y="182" width="22" height="398" rx="3"/>
    </g>
    <polyline points="556,550 586,502 616,508 646,456 676,420 706,426 736,382 766,348 796,346 826,306 856,310 886,256 916,208 946,182"
              fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="9 7" opacity="0.85"/>
    <g fill="#FFFFFF" opacity="0.9">
      <circle cx="586" cy="502" r="3.5"/><circle cx="646" cy="456" r="3.5"/><circle cx="706" cy="426" r="3.5"/>
      <circle cx="766" cy="348" r="3.5"/><circle cx="826" cy="306" r="3.5"/><circle cx="886" cy="256" r="3.5"/>
      <circle cx="946" cy="182" r="3.5"/>
    </g>
    <text x="596" y="548" font-size="12" fill="#FFFFFF" opacity="0.65" transform="rotate(-38 596 548)">heat score (normalised)</text>
  </g>

  <!-- curling lip + foam -->
  <path d="M 1012,168 C 975,110 895,105 860,150 C 836,181 848,226 880,236" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round"/>
  <g fill="#FFFFFF">
    <circle cx="866" cy="242" r="18"/><circle cx="902" cy="252" r="13"/><circle cx="836" cy="228" r="12"/>
    <circle cx="990" cy="122" r="7" opacity="0.9"/><circle cx="1022" cy="142" r="5" opacity="0.8"/>
    <circle cx="944" cy="96" r="6" opacity="0.85"/><circle cx="906" cy="80" r="8" opacity="0.8"/>
    <circle cx="866" cy="104" r="5" opacity="0.75"/>
  </g>

  <!-- monte carlo dice flung off the lip -->
  <g transform="translate(850,62) rotate(-14)">
    <rect x="-19" y="-19" width="38" height="38" rx="8" fill="#FFFFFF" stroke="#12354F" stroke-width="3"/>
    <g fill="#12354F"><circle cx="-8" cy="-8" r="3.4"/><circle cx="8" cy="-8" r="3.4"/><circle cx="-8" cy="8" r="3.4"/><circle cx="8" cy="8" r="3.4"/><circle cx="0" cy="0" r="3.4"/></g>
  </g>
  <g transform="translate(790,98) rotate(18)">
